<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/recuperarClStyles.css">
    <title>Olvidar Contraseña</title>
</head>

<body>
    <div class="container">

        <img id="imgFondo" src="../resources/fondoOnda.jpg">

        <div class="primeraMitad">
            <img id="imgDerecha" src="../resources/recuperarContra.png">

        </div>

        <div class="segundaMitad">
            <form class="card">

                <div class="topCard">
                    <h1>Recuperar contraseña</h1>
                    <p>
                        Si olvidaste tu clave anterior, puedes iniciar un proceso de recuperación<br>
                        Te enviaremos un código a tu correo para que completes un procedimiento.
                    </p>
                </div>

                <div class="correos">
                    <span><i class="fa fa-user"></i>Correo electrónico</span>
                    <input type="email" name="email" id="email" required>
                </div>

                <div class="bottom-card">
                    <button type="submit" class="button"> Recuperar contraseña </button>

                    <div class="links">
                        <a href="./login.html" id="inicio"> Inicia sesión aquí</a>
                        <a href="./registroUsuario.html" id="noCuenta"> Aún no tienes cuenta?</a>
                    </div>
                </div>

            </form>
        </div>
    </div>

    <script src="../js/"> </script>

</body>

</html>
