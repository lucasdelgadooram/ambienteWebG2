<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/singUPStyles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Registro de usuario</title>

</head>

<body>

    <div class="contenedor">

        <img id="imgFondo" src="../resources/fondoOnda.jpg" width="100%" height="100%">

        <div class="cards-login">
            <form class="card">

                <div class=top>
                    <img src="../resources/p(new).png" width="60px" height="60px">
                </div>

                <div class=medio>

                    <div class="correos">
                        <span><i class="fa fa-user"></i>Correo electrónico</span>
                        <input type="email" name="email" id="email" required>
                    </div>

                    <div class="claves">
                        <span> <i class="fa fa-lock"></i>Contraseña</span>
                        <input type="password" name="password" id="password" required>
                    </div>

                    <div class="confirmar">
                        <span> <i class="fa fa-lock"></i>Confirmar contraseña</span>
                        <input type="password" name="confirmar" id="confirmar" required>
                    </div>

                    <div class="junto">
                        <span id="politicas">Acepto las politicas de privacidad </span>
                        <input type="checkbox" name="politicas">
                    </div>
                </div>

                <div class="bottom-card">
                    <button type="submit" class="button"> Registrar </button>

                    <div class="links">
                        <a href="./login.html" id="siCuenta"> Ya tienes una cuenta? inicia aquí</a>
                    </div>
                </div>

            </form>

        </div>


    </div>

    <script src="../js/"> </script>
</body>

</html>
