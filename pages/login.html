<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/loginStyles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Inicio de sesión</title>
    
</head>

<body>

    <div class="contenedor">

        <div class="twoHalf">
            <img src="../resources/p(new).png">
        </div>

        <div class="cards-login">
            <form class="card">

                <div class=top> 
                    <h2>Bienvenido de vuelta!</h2>
                    <p> Si aún no tienes una cuenta, puedes registrarte en "Aún no tienes <br>una cuenta?" es gratis y rápido</p>
                </div>

                <div class=medio>

                    <div class="correos">
                        <span><i class="fa fa-user"></i>Correo electrónico</span>
                        <input type="email" name="email" id="email" required>
                    </div>

                    <div class="claves">
                        <span> <i class="fa fa-lock"></i>Contraseña</span>
                        <input type="password" name="password" id="password" required>
                    </div>

                    <div class="junto">
                        <span>Recuerdame </span>
                        <input type="checkbox" name="remember">
                    </div>

                </div>

                <div class="bottom-card">
                    <button type="submit" class="button"> Iniciar Sesión </button>

                    <div class="links">
                        <a href="./olvidarContrasenia.html" id="olvidar"> Has olvidado tu contraseña?</a>
                        <a href="./registroUsuario.html" id="noCuenta"> Aún no tienes cuenta?</a>
                    </div>
                </div>

            </form>

        </div>


    </div>

    <script src="../js/"> </script>
</body>

</html>
